name: Deploy Aamontron to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages needs write access to create/push the
    # gh-pages branch; the default GITHUB_TOKEN is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production
        # GitHub Pages serves this repo at /aamontron/, so assets must
        # resolve from that sub-path, not the root.
        run: npx ng build --configuration=production --base-href=/aamontron/

      - name: Add 404 fallback for SPA routes
        run: cp ./dist/aamontron-site/browser/index.html ./dist/aamontron-site/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/aamontron-site/browser
          enable_jekyll: false
